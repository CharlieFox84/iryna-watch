name: Validate RSS Feed

on:
  push:
    branches:
      - dev

jobs:
  validate-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Log RSS validation output
        run: |
          curl -s \
            -A "Mozilla/5.0" \
            --data-urlencode "url=https://raw.githubusercontent.com/charliefox84/iryna-watch/dev/rss.xml" \
            https://validator.w3.org/feed/check.cgi > rss-validator.log

      - name: Notify via Pushover
        if: always()
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          set +e

          RSS=$(curl -s https://raw.githubusercontent.com/charliefox84/iryna-watch/dev/rss.xml)

          LAST=$(echo "$RSS" | grep -oP '(?<=<lastBuildDate>).*?(?=</lastBuildDate>)') || true
          [ -z "$LAST" ] && LAST="(not found)"

          COUNT=$(echo "$RSS" | grep -c "<item>") || true

          VALIDATION=$(grep -o "This is a valid RSS feed" rss-validator.log || echo "RSS feed has validation issues")

          MESSAGE="🔎 $VALIDATION | 🧾 Items: $COUNT | 🕓 Updated: $LAST"

          echo "Sending message: $MESSAGE"

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=RSS Validation" \
            --form-string "message=$MESSAGE" \
            https://api.pushover.net/1/messages.json)

          echo "Pushover response: $RESPONSE"