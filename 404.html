<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found</title>
  <style>
    body {
      background-color: #333;
      color: #f9f9f9;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 4rem 1rem;
    }
    .icon {
      max-width: 120px;
      margin-bottom: 2rem;
    }
    a {
      color: #eee;
      text-decoration: underline;
      display: block;
      margin: 0.5rem 0;
    }
    a:hover {
      color: #ccc;
    }

    .github-icon {
      width: 32px;
      height: 32px;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0.85;
    }

    .github-icon:hover {
      transform: scale(1.1);
      opacity: 1;
    }

    @media (max-width: 600px) {
      .github-icon {
      width: 48px;
      height: 48px;
    }
    }
  </style>
</head>
<body>
  <img src="./assets/question-solid-full.svg" alt="404 icon" class="icon" />
  <i class="fa-solid fa-question" style="color: #f9f9f9;"></i>
  <h1>Page not found</h1>
  <p>This page doesn’t exist or has been moved.</p>
  <a href="/index.html">Return to timeline</a>
  <a href="https://github.com/CharlieFox84/iryna-watch" target="_blank" rel="noopener" aria-label="View source on GitHub">
  <img src="/assets/github-brands-solid-full-3.svg" alt="GitHub logo" title="View on GitHub" class="github-icon" />
</a>
</body>
</html>
